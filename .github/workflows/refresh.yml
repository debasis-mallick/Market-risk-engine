name: Scheduled Data Refresh

on:
  schedule:
    - cron: "0 6 * * 1-5"  # 6:00 AM UTC, Monday-Friday (weekdays only, matches market days)
  workflow_dispatch:  # allows manual triggering from GitHub's UI too

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Run pipeline refresh
        run: python src/pipeline_refresh.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          git diff --staged --quiet || git commit -m "Automated data refresh $(date -u +'%Y-%m-%d')"
          git push